version: '3.8'

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - bike-network

  producer:
    build:
      context: ./IngestionService
      dockerfile: Dockerfile
    container_name: csharp-producer
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "5000:8080"
    networks:
      - bike-network
    depends_on:
      - kafka
    
  
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - bike-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: BikeFleet
    ports:
      - "3306:3306"
    networks:
      - bike-network

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - bike-network

  processing-service:
    build:
      context: ./ProcessingService
      dockerfile: Dockerfile
    container_name: processing-service
    restart: always
    depends_on:
      - kafka
      - redis
      - mysql
      - mongo
    networks:
      - bike-network

  api:
    build:
      context: ./aspAPI
      dockerfile: Dockerfile
    container_name: csharp-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ElasticsearchSettings__Url=http://es:9200
    ports:
      - "5268:8080"
    networks:
      - bike-network
    depends_on:
      - mysql
      - mongo
      - redis

networks:
  bike-network:
    driver: bridge